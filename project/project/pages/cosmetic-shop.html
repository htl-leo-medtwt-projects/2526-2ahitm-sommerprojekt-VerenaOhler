<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetic shop</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" defer></script>
    <script src="./script/script.js" defer></script>
</head> 

<body>
    <div id="shop-header">COSMETIC - SHOP</div>
    <div id="shop-closeButton">
        <span onclick="closeSettings()" id="shop-closeButtonText">X</span>
    </div>
    <div id="shop-container">
        <div id="shop-wrapper">
            <div class="shop-items">
                <img src="./img/Bob.png" alt="character" class="character-img">
                <div class="coin"><img src="./img/Coin.png" alt="Coin image"></div>
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Bub', 0)">
                    Buy
                </div>
            </div>
            <div class="shop-items">
                <img src="./img/Bub.png" alt="character" class="character-img">
                <div class="coin"><img src="./img/Coin.png" alt="Coin image"></div>
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Bob', 1)">
                    Buy
                </div>
            </div>
            <div class="shop-items">
                <img src="./img/Pyro.png" alt="character" class="character-img">
                <div class="coin"><img src="./img/Coin.png" alt="Coin image"></div>
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Pyro', 2)">
                    Buy
                </div>
            </div>

            <div class="shop-items">
                <img src="./img/Glacia.png" alt="character" class="character-img">
                <div class="coin"><img src="./img/Coin.png" alt="Coin image"><p>10</p></div>
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Glacia', 3)">
                    Buy
                </div>
            </div>

            <div class="shop-items">
                <img src="./img/Shadow.png" alt="character" class="character-img">
                <div class="coin"><img src="./img/Coin.png" alt="Coin image"></div>
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Shadow', 4)">
                    Buy
                </div>
            </div>
            <div class="shop-items">
                <div class="character-img"><p>Coming Soon!</p></div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
