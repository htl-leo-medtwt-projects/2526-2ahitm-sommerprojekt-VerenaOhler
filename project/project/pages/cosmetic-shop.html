<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <div id="shop-header">COSMETIC - SHOP</div>

                    Buy
                </div>
            </div>
            <div class="shop-items">
                <img src="./img/pixil-frame-0.png" alt="character" class="character-img">

                    Buy
                </div>
            </div>
            <div class="shop-items">
                <img src="./img/pixil-frame-0.png" alt="character" class="character-img">

                    Buy
                </div>
            </div>

            <div class="shop-items">
                <img src="./img/pixil-frame-0.png" alt="character" class="character-img">
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Pyro', 3)">
                    Buy
                </div>
            </div>

            <div class="shop-items">
                <img src="./img/pixil-frame-0.png" alt="character" class="character-img">
                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Glacia', 4)">
                    Buy
                </div>
            </div>
            <div class="shop-items">

                <div class="buy-Button" data-set="buy" onclick="buyCharacter(this, 'Shadow', 5)">
                    Buy
                </div>
            </div>

    </div>
    </div>
