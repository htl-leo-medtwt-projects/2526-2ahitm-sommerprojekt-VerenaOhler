<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamescreen</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js" defer></script> -->
    <script src="./script/game.js" defer></script>
    <script src="./script/script.js" defer></script>

</head>
<body>
    <img src="./img/level_1.png" alt="level 1" id="level-bg">
        <div id="temp-winLoose">
            <div class="btn" id="winbtn" onclick="win()"></div>
            <div class="btn" id="loosebtn" onclick="loose()"></div>
        </div>

        <div id="playerBox">
                <img src="./img/Screenshot 2026-05-05 103503.png" alt="" id="spriteImg">
            </div>

        <div id="win-container">
            <p>Level Up!</p>
            <img src="./img/pixil-frame-0 (4).png" alt="Winners Icon">
            <div id="win-btnContainer">
                <div class="win-btn">Go back!</div>
                <div class="win-btn">Next Level</div>
            </div>
        </div>

        <div id="loose-container">
            <p>Game over</p>
            <img src="./img/pixil-frame-0 (5).png" alt="loose Icon">
            <div id="loose-btnContainer">
                <div class="loose-btn">Go back!</div>
                <div class="loose-btn">play again</div>
            </div>
        </div>
</body>
</html>
